<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>$title</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#202124;font:14px/1.5 "Segoe UI","Microsoft YaHei",sans-serif;letter-spacing:0}main{max-width:1320px;margin:auto;padding:24px}h1{font-size:24px;line-height:1.35;margin:0 0 8px}h2{font-size:17px;margin:0}.metadata{display:flex;flex-wrap:wrap;gap:4px 18px;color:#64666b;font-size:13px}.stats{display:flex;flex-wrap:wrap;gap:16px 38px;margin:20px 0 16px;padding:14px 0;border-top:1px solid #dedfe2;border-bottom:1px solid #dedfe2}.stats div{min-width:84px}dt{color:#64666b;font-size:12px}dd{font-size:22px;font-weight:600;margin:0}.role{display:inline-block;border-radius:3px;padding:2px 7px;font-size:12px;line-height:1.5;white-space:nowrap}.role-healer{background:#e8f5ec;color:#11693b}.role-dps{background:#fdecea;color:#b42318}.role-tank{background:#e9f0ff;color:#145bc7}.role-support,.role-unknown{background:#eff0f2;color:#53565d}.role-text-healer{color:#11693b}.role-text-dps{color:#b42318}.role-text-tank{color:#145bc7}.role-text-support,.role-text-unknown{color:#53565d}.player-name{font-weight:600}.healers{display:flex;align-items:baseline;gap:12px;margin:9px 0}.healers>strong{min-width:64px}.healers>span{display:flex;flex-wrap:wrap;gap:5px}.warnings{margin:14px 0;color:#795a12;font-size:13px}.warnings li{overflow-wrap:anywhere}.toolbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin:22px 0 12px;border-bottom:1px solid #dedfe2;padding-bottom:10px}.tabs{display:flex;gap:4px;flex-wrap:wrap}.tabs button{font:inherit;padding:7px 12px;border:0;border-radius:3px;background:transparent;color:#555;cursor:pointer}.tabs button[aria-selected=true]{background:#202124;color:#fff}.filters{display:flex;gap:8px;flex-wrap:wrap}.filters input,.filters select{font:inherit;border:1px solid #c9cbd0;border-radius:3px;padding:6px 9px;background:#fff;min-height:35px}.filters input{width:185px}.filters select{width:125px}.table-scroll{max-width:100%;overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap;font-size:13px}th{text-align:left;font-weight:600;background:#f5f6f7;color:#54575e}th,td{padding:9px 12px;border-bottom:1px solid #e8e9eb;vertical-align:middle}tbody tr:hover{background:#fafbfc}.present{color:#25272b}.absent{color:#93969c}.number{font-variant-numeric:tabular-nums}.battle{margin:0 0 28px}.battle-heading{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;justify-content:space-between}.battle-heading a{color:#145bc7;text-decoration:none;font-size:13px}.battle-meta{font-size:12px;color:#71757b;margin:5px 0 10px}.legend{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.scope{margin:10px 0;color:#73767b;font-size:12px}footer{border-top:1px solid #dedfe2;padding-top:14px;margin-top:22px;color:#73767b;font-size:12px}[hidden]{display:none!important}@media(max-width:600px){main{padding:16px 12px}h1{font-size:21px}.stats{gap:12px 22px}.stats div{min-width:74px}.toolbar{align-items:stretch}.filters{width:100%}.filters input{flex:1;min-width:100px;width:140px}.healers{align-items:flex-start}th,td{padding:8px 9px}}
</style>
</head>
<body><main>
<header><h1>$title</h1><div class="metadata">$metadata</div></header>
<dl class="stats">$stats</dl>
$healers
$warnings
<div class="toolbar">
<div class="tabs" role="tablist" aria-label="出勤视图"><button id="daily-tab" type="button" role="tab" aria-controls="daily" aria-selected="true" data-view="daily">每日汇总</button><button id="battles-tab" type="button" role="tab" aria-controls="battles" aria-selected="false" data-view="battles">逐场明细</button></div>
<div class="filters"><input type="search" id="player-filter" aria-label="筛选玩家" placeholder="筛选玩家"><select id="role-filter" aria-label="筛选角色"><option value="">全部角色</option><option value="healer">奶妈</option><option value="dps">DPS</option><option value="tank">tank</option><option value="support">辅助</option><option value="unknown">未知</option></select></div>
</div>
<div class="legend">$legend</div>
<section id="daily" role="tabpanel" aria-labelledby="daily-tab">$summary</section>
<section id="battles" role="tabpanel" aria-labelledby="battles-tab" hidden>$detail</section>
<footer>每日总场次按 12u、14u 时段去重，同一时段多份战报只计一次，最多 2 次。逐场明细保留全部战报。“未记录”表示未出现在对应时段的战报中。角色取自战报 role，缺失角色标为未知。</footer>
</main>
<script>
(function(){
  const tabs=Array.from(document.querySelectorAll('[data-view]'));
  const player=document.getElementById('player-filter');
  const role=document.getElementById('role-filter');
  function selectView(view){
    tabs.forEach(function(tab){const selected=tab.dataset.view===view;tab.setAttribute('aria-selected',String(selected));document.getElementById(tab.dataset.view).hidden=!selected;});
  }
  tabs.forEach(function(tab){tab.addEventListener('click',function(){selectView(tab.dataset.view);});});
  function filterRows(){
    const name=player.value.trim().toLowerCase();
    document.querySelectorAll('tr[data-player]').forEach(function(row){row.hidden=!(row.dataset.player.includes(name)&&(!role.value||row.dataset.roles.split(',').includes(role.value)));});
  }
  player.addEventListener('input',filterRows);
  role.addEventListener('change',filterRows);
  if(location.hash==='#battles'){selectView('battles');}
})();
</script>
</body></html>
